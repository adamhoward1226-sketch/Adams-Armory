name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: Use the project's fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp android/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AdamsArmory.apk
      - uses: actions/upload-artifact@v4
        with: { name: AdamsArmory-apk, path: AdamsArmory.apk }
      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Adam's Armory (build ${{ github.run_number }})
          make_latest: true
          files: AdamsArmory.apk
